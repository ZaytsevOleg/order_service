{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ brand_title }}</title>
        {% if brand_favicon %}
    <link rel="icon" type="image/png" href="{% static brand_favicon %}">
    {% endif %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static brand_theme_css %}">
    <style>
        body {
            background: var(--brand-bg);
            color: var(--brand-text);
            font-family: var(--brand-font);
        }

        .dashboard-page {
            max-width: 1180px;
            margin: 40px auto;
            padding: 0 24px;
        }

        .dashboard-header {
            background: var(--brand-surface);
            border-radius: 24px;
            padding: 32px;
            margin-bottom: 32px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
        }

        .user-block {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--brand-control-bg, #f1f1f1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .user-title {
            font-size: 24px;
            font-weight: 600;
        }

        .user-subtitle {
            color: var(--brand-muted);
            margin-top: 6px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
        }

        .dashboard-card {
            background: var(--brand-surface);
            border-radius: 24px;
            padding: 36px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
        }

        .section-title {
            color: var(--brand-primary);
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .section-title span {
            color: var(--brand-text);
            font-weight: 400;
        }

        .menu-link {
            display: block;
            color: var(--brand-text);
            font-size: 20px;
            text-decoration: none;
            margin-bottom: 18px;
        }

        .menu-link:hover {
            color: var(--brand-primary);
        }

        .logout-block {
            margin-top: 32px;
            background: var(--brand-surface);
            border-radius: 24px;
            padding: 28px 36px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
        }

        .logout-link {
            color: var(--brand-text);
            font-weight: 700;
            font-size: 20px;
            text-decoration: none;
        }

        .logout-link:hover {
            color: var(--brand-primary);
        }

        @media (max-width: 768px) {
            .dashboard-page {
                margin: 24px auto;
                padding: 0 18px;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
                gap: 24px;
            }

            .dashboard-card,
            .dashboard-header,
            .logout-block {
                box-shadow: none;
                border-radius: 0;
                padding: 28px 0;
                border-bottom: 1px solid var(--brand-border);
                background: transparent;
            }

            .section-title {
                font-size: 24px;
            }

            .menu-link {
                font-size: 20px;
            }
        }
        /* =========================================
        Orders Page
        ========================================= */

        .orders-page {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 24px;
        }

        /* =========================================
        Верхняя панель
        ========================================= */

        .orders-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .search-box {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;

            background: var(--brand-control-bg, #f4f4f4);
            border-radius: 20px;
            padding: 14px 18px;

            border: 1px solid var(--brand-border);
        }

        .search-box input {
            width: 100%;
            border: none;
            background: transparent;
            outline: none;

            font-size: 16px;
        }

        .menu-icon,
        .search-icon {
            font-size: 20px;
            color: var(--brand-muted);
        }

        .create-order-btn {
            background: var(--brand-primary);
            color: var(--brand-on-primary);

            padding: 14px 24px;

            border-radius: 20px;
            text-decoration: none;
            font-weight: 600;

            transition: 0.2s;
        }

        .create-order-btn:hover {
            background: var(--brand-primary-hover);
            color: var(--brand-on-primary);
        }

        /* =========================================
        Заголовок
        ========================================= */

        .orders-header {
            border-bottom: 1px solid var(--brand-border);
            margin-bottom: 32px;
        }

        .orders-header h1 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .breadcrumbs {
            margin-top: 10px;
            margin-bottom: 20px;

            color: var(--brand-muted);
            font-size: 14px;
        }

        .breadcrumbs a {
            color: var(--brand-muted);
            text-decoration: none;
        }

        .breadcrumbs a:hover {
            color: var(--brand-primary);
        }

        .breadcrumbs span {
            margin: 0 6px;
        }        

        /* =========================================
        Список заказов
        ========================================= */

        .orders-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* =========================================
        Карточка заказа
        ========================================= */

        .order-card {
            background: var(--brand-surface-soft, #fafafa);

            border: 1px solid var(--brand-border);
            border-radius: 20px;

            padding: 20px 28px;

            transition: 0.2s;
        }

        .order-card:hover {
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
        }

        /* =========================================
        Шапка карточки
        ========================================= */

        /* .order-card-head {
            display: grid;

            grid-template-columns:
                180px
                320px
                150px
                200px;

            gap: 20px;

            font-size: 13px;
            color: var(--brand-muted);

            padding-bottom: 10px;
            border-bottom: 1px solid var(--brand-border);
        } */

        .order-number {
            color: var(--brand-primary);
            font-weight: 700;
        }

        /* =========================================
        Данные карточки
        ========================================= */

        .order-card-head {
            display: grid;
            grid-template-columns:
                180px
                520px
                180px
                180px;

            gap: 20px;

            padding-bottom: 12px;
            margin-bottom: 12px;

            border-bottom: 1px solid var(--brand-border);
        }
        .order-card-body {
            display: grid;
            grid-template-columns:
                180px   /* дата */
                520px   /* клиент */
                180px   /* сумма */
                180px;  /* статус */

            gap: 20px;
            align-items: center;
        }

        /* =========================================
        Статусы
        ========================================= */

        .status-dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            display: inline-block;
            margin-right: 8px;

            vertical-align: middle;
        }

        .status-new {
            background: var(--brand-primary);
        }

        .status-paid {
            background: #28a745;
        }

        .status-processing {
            background: #ff9800;
        }

        .status-cancelled {
            background: #6c757d;
        }
        .status-cell {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .order-card-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .order-card-link:hover {
            color: inherit;
        }        


        /* =========================================
        Пустой список
        ========================================= */

        .empty-orders {
            text-align: center;
            padding: 60px;

            color: #999;
            font-size: 20px;
        }

        /* =========================================
        Mobile
        ========================================= */

        @media (max-width: 768px) {

            .orders-page {
                padding: 0 16px;
                margin-top: 20px;
            }

            .orders-topbar {
                flex-direction: column;
                align-items: stretch;
            }

            .create-order-btn {
                text-align: center;
            }

            .orders-header h1 {
                font-size: 26px;
            }

            .order-card {
                padding: 16px;
                border-radius: 18px;
            }

            .order-card-head,
            .order-card-body {
                grid-template-columns:
                    1fr
                    1.5fr
                    1fr
                    1fr;

                gap: 8px;
            }

            .order-card-head {
                font-size: 10px;
            }

            .order-card-body {
                font-size: 11px;
            }
        }
         /* =========================================
        order_detail
        ========================================= */

        .order-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 24px;
            margin-bottom: 28px;
        }

        .order-title-row h1 {
            margin: 0;
            font-size: 32px;
            font-weight: 600;
        }

        .order-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            background: var(--brand-bg);
            border: 1px solid var(--brand-border);
            border-radius: 18px;

            padding: 10px 16px;
            font-weight: 600;
        }

        .order-info-card {
            background: var(--brand-surface-soft, #fafafa);
            border: 1px solid var(--brand-border);
            border-radius: 22px;

            padding: 24px 28px;
            margin-bottom: 20px;

            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
            gap: 24px;
        }

        .order-info-item span {
            display: block;
            color: var(--brand-muted);
            font-size: 13px;
            margin-bottom: 8px;
        }

        .order-info-item strong {
            display: block;
            color: var(--brand-text);
            font-size: 15px;
            font-weight: 600;
        }

        .order-info-total strong {
            color: var(--brand-primary);
            font-size: 18px;
        }

        .order-comment {
            background: var(--brand-surface);
            border-left: 4px solid var(--brand-primary);
            border-radius: 12px;

            padding: 16px 20px;
            margin-bottom: 32px;

            color: var(--brand-text-secondary, #444);
        }

        .order-comment strong {
            margin-right: 8px;
        }

        .products-header {
            display: flex;
            justify-content: space-between;
            align-items: end;

            margin-bottom: 16px;
        }

        .products-header h2 {
            margin: 0;
            font-size: 26px;
            font-weight: 600;
        }

        .products-header span {
            color: var(--brand-muted);
            font-size: 14px;
        }

        .products-table-wrap {
            background: var(--brand-surface-soft, #fafafa);
            border: 1px solid var(--brand-border);
            border-radius: 22px;

            padding: 20px;
            overflow-x: auto;
        }

        .products-table {
            margin-bottom: 0;
            min-width: 900px;
        }

        .products-table th {
            color: var(--brand-muted);
            font-size: 13px;
            font-weight: 500;
            border-bottom: 1px solid var(--brand-border);
        }

        .products-table td {
            vertical-align: middle;
            font-size: 14px;
        }

        .product-name {
            font-weight: 600;
            color: var(--brand-text);
        }

        .product-article {
            color: var(--brand-muted);
            font-size: 12px;
            margin-top: 4px;
        }

        .product-row-total {
            font-weight: 700;
        }

        .empty-products {
            text-align: center;
            color: var(--brand-muted);
            padding: 32px;
        }
        .order-status-block {
            display: flex;
            flex-direction: column;
            gap: 10px;

            min-width: 180px;
        }

        .order-status-title {
            display: flex;
            align-items: center;
            gap: 8px;

            font-size: 14px;
            font-weight: 600;
            color: var(--brand-text);
        }

        .order-status-title i {
            color: var(--brand-primary);
            font-size: 18px;
        }

        .order-status-progress {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
        }

        .order-status-progress span {
            height: 6px;
            border-radius: 999px;
            background: var(--brand-step-bg, #e2e2e2);
        }

        .status-step-1 span:nth-child(-n+1),
        .status-step-2 span:nth-child(-n+2),
        .status-step-3 span:nth-child(-n+3),
        .status-step-4 span:nth-child(-n+4),
        .status-step-5 span:nth-child(-n+5) {
            background: var(--brand-primary);
        }
        .order-detail-status {
            min-width: 220px;
            background: var(--brand-surface);
            border: 1px solid var(--brand-border);
            border-radius: 18px;
            padding: 14px 18px;
        }

        @media (max-width: 768px) {
            .order-title-row {
                flex-direction: column;
                align-items: flex-start;
            }

            .order-title-row h1 {
                font-size: 26px;
            }

            .order-info-card {
                grid-template-columns: 1fr;
                gap: 16px;
                padding: 20px;
            }

            .products-table-wrap {
                padding: 12px;
            }

            .products-table {
                font-size: 12px;
                min-width: 760px;
            }
        }

        .mobile-products-list {
            display: none;
        }

        /* Desktop */
        .desktop-products-table {
            display: block;
        }

        /* Mobile */
        @media (max-width: 768px) {
            .desktop-products-table {
                display: none;
            }

            .mobile-products-list {
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .mobile-product-card {
                background: var(--brand-surface);
                border: 1px solid var(--brand-border);
                border-radius: 16px;
                padding: 14px;
            }

            .mobile-product-card .product-name {
                font-size: 15px;
                font-weight: 600;
                margin-bottom: 16px;
            }

            .mobile-product-card .product-article {
                font-size: 12px;
                color: var(--brand-muted);
                margin-bottom: 6px;
            }

            .product-details {
                margin-top: 12px;
            }

            .product-details-row {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 24px;
            }

            .product-details-row:first-child {
                padding-bottom: 12px;
                margin-bottom: 12px;
                border-bottom: 1px solid var(--brand-border-soft, #e6e3e3);
            }

            .product-details-item {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            .product-details-item span {
                color: var(--brand-muted);
                font-size: 12px;
                font-weight: 400;
                }

            .product-details-item strong {
                font-size: 13px;
                font-weight: 600;
            }       
            .order-card-head {
                grid-template-columns: 1.2fr 1.6fr 1fr;
            }
            .order-card-head > div:nth-child(4) {
                display: none;
            }            
            .order-card-body {
                grid-template-columns: 0.8fr 1.6fr 1fr;
                gap: 10px;
                align-items: start;
            }
            .order-status-block {
                grid-column: 1 / -1;

                margin-top: 8px;
                padding-top: 8px;

                border-top: 1px solid var(--brand-border-soft, #e5e5e5);

                width: 100%;
                min-width: 0;
            }
            .order-status-title {
                display: flex;
                justify-content: space-between;
                align-items: center;

                font-size: 12px;
                margin-bottom: 6px;
            }

            .order-status-title i {
                font-size: 15px;
            }
            .order-status-progress {
                width: 100%;
                gap: 6px;
            }

            .order-status-progress span {
                height: 5px;
            }
            .order-detail-status {
                width: 100%;
                min-width: 0;
            }
        }  

        /* =========================================
        Создание заказа
        ========================================= */
        .order-create-page {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 24px;
        }

        .order-create-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .order-create-header h1 {
            font-size: 34px;
            font-weight: 700;
        }

        .create-step-indicator {
            display: flex;
            gap: 8px;
        }

        .create-step-indicator span {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--brand-step-bg, #e5e5e5);
            color: var(--brand-muted);

            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: 700;
        }

        .create-step-indicator span.active {
            background: var(--brand-primary);
            color: var(--brand-on-primary);
        }

        .order-create-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 320px;
            gap: 28px;
        }

        .order-create-main,
        .order-cart-summary {
            background: var(--brand-surface);
            border: 1px solid var(--brand-border);
            border-radius: 24px;
            padding: 28px;
        }

        .order-step {
            display: none;
        }

        .order-step.active {
            display: block;
        }

        .order-step h2 {
            font-size: 26px;
            margin-bottom: 24px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-field.full-width {
            grid-column: 1 / -1;
        }

        .form-field label {
            color: var(--brand-muted);
            font-size: 14px;
        }

        .form-field input,
        .form-field select,
        .form-field textarea,
        .product-search-row input,
        .product-select-table input {
            border: 1px solid var(--brand-border);
            border-radius: 14px;
            padding: 12px 14px;
            font-size: 15px;
            outline: none;
        }

        .product-search-row {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .product-search-row input {
            flex: 1;
        }

        .primary-btn,
        .small-btn {
            background: var(--brand-primary);
            color: var(--brand-on-primary);
            border: none;
            border-radius: 16px;
            padding: 12px 20px;
            font-weight: 700;
            cursor: pointer;
        }

        .secondary-btn {
            background: var(--brand-control-bg, #f3f3f3);
            color: var(--brand-text);
            border: none;
            border-radius: 16px;
            padding: 12px 20px;
            font-weight: 700;
            cursor: pointer;
        }

        .small-btn {
            padding: 8px 14px;
            font-size: 13px;
        }

        .promo-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .promo-card {
            border: 1px solid var(--brand-border);
            border-radius: 18px;
            padding: 20px;
            background: var(--brand-surface-soft, #fafafa);
        }

        .promo-card h3 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .promo-card p {
            color: var(--brand-muted);
        }

        .promo-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        .confirm-card {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
        }

        .confirm-card div {
            background: var(--brand-surface-soft, #fafafa);
            border-radius: 16px;
            padding: 18px;
        }

        .confirm-card span {
            display: block;
            color: var(--brand-muted);
            font-size: 13px;
            margin-bottom: 8px;
        }

        .confirm-card strong {
            font-size: 16px;
        }

        .order-create-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 32px;
        }

        .d-none {
            display: none !important;
        }

        .order-cart-summary {
            position: sticky;
            top: 24px;
            height: fit-content;
        }

        .order-cart-summary h3 {
            margin-bottom: 20px;
        }

        .cart-summary-row,
        .cart-summary-total {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--brand-border-soft, #eee);
        }

        .cart-summary-total {
            border-bottom: none;
            margin-top: 12px;
            font-size: 18px;
        }

        .cart-summary-total strong {
            color: var(--brand-primary);
        }

        @media (max-width: 900px) {
            .order-create-layout {
                grid-template-columns: 1fr;
            }

            .order-cart-summary {
                position: static;
            }

            .form-grid,
            .promo-grid,
            .confirm-card {
                grid-template-columns: 1fr;
            }

            .order-create-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 18px;
            }

            .product-search-row {
                flex-direction: column;
            }
        }

        
        .brand-header {
            width: 100%;
            background: var(--brand-header-bg);
            border-bottom: 1px solid var(--brand-border);
        }

        .brand-header-inner {
            max-width: 1400px;
            margin: 0 auto;
            padding: 14px 24px;

            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;

            min-height: 72px;
        }

        .brand-header-left {
            display: flex;
            justify-content: flex-start;
        }

        .brand-header-right {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 18px;
        }

        .brand-menu-button,
        .brand-header-icon {
            width: 42px;
            height: 42px;

            border: none;
            background: transparent;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            color: var(--brand-text);
            text-decoration: none;

            font-size: 26px;
            cursor: pointer;
        }

        .brand-menu-button:hover,
        .brand-header-icon:hover {
            color: var(--brand-primary);
        }

        .brand-header-logo {
            display: flex;
            align-items: center;
            justify-content: center;

            text-decoration: none;
            color: var(--brand-text);
        }

        .brand-header-logo img {
            display: block;
            max-width: 160px;
            max-height: 42px;
            object-fit: contain;
        }

        .brand-header-user {
            display: flex;
            align-items: center;
            justify-content: center;

            color: var(--brand-text);
            font-size: 26px;
        }

        @media (max-width: 768px) {

            .brand-header-inner {
                min-height: 62px;
                padding: 10px 14px;
            }

            .brand-header-logo img {
                max-width: 120px;
                max-height: 34px;
            }

            .brand-menu-button,
            .brand-header-icon,
            .brand-header-user {
                font-size: 22px;
            }
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>
    <header class="brand-header">
        <div class="brand-header-inner">

            <div class="brand-header-left">
                <button
                    type="button"
                    class="brand-menu-button"
                    aria-label="Меню"
                >
                    <i class="bi bi-list"></i>
                </button>
            </div>

            <a
                href="{% url 'home' %}"
                class="brand-header-logo"
            >
                {% if brand_logo %}
                    <img
                        src="{% static brand_logo %}"
                        alt="{{ brand_title }}"
                    >
                {% else %}
                    <span>
                        {{ brand_title }}
                    </span>
                {% endif %}
            </a>

            <div class="brand-header-right">
                {% if user.is_authenticated %}
                    <a
                        href="{% url 'order_list' %}"
                        class="brand-header-icon"
                        title="Мои заказы"
                    >
                        <i class="bi bi-cart3"></i>
                    </a>

                    <div class="brand-header-user">
                        <i class="bi bi-person-circle"></i>
                    </div>
                {% endif %}
            </div>

        </div>
    </header>
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
